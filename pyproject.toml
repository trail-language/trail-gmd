[project]
name = "trail-gmd"
version = "0.3.0"
description = "Global Macro Database source for Trail: country-by-year macro indicators"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Usman Shahid", email = "u.manshahid@gmail.com" }]
keywords = ["macro", "macroeconomics", "gmd", "global-macro-database", "trail", "countries", "polars"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
]
dependencies = [
    "trail-lang>=0.13",
    "polars>=1.20",
    "httpx>=0.27",
]

# Registers the `gmd` driver and the `gmd.*` field vocabulary for trail.yaml + validation.
[project.entry-points."trail.sources"]
gmd = "trail_gmd:GmdSource"

[project.entry-points."trail.schema"]
gmd = "trail_gmd:SCHEMA_FIELDS"

[project.urls]
Homepage = "https://github.com/trail-language"
Repository = "https://github.com/trail-language/trail-gmd"
Issues = "https://github.com/trail-language/trail-gmd/issues"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trail_gmd"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the live GMD S3 endpoint (needs network)"]
addopts = "-m 'not live'"
